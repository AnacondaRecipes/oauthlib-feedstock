{% set name = "oauthlib" %}
{% set version = "3.2.1" %}
{% set compress_type = "tar.gz" %}
{% set hash_type = "sha256" %}
{% set hash = "1565237372795bf6ee3e5aba5e2a85bd5a65d0e2aa5c628b9a97b7d7a0da3721" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ compress_type }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ compress_type }}
  {{ hash_type }}: {{ hash }}

build:
  number: 0
  skip: True  # [py<36]
  script: python -m pip install --no-deps --ignore-installed . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - cryptography >=3.0.0
    - pyjwt >=2.0.0,<3
    - blinker >=1.4.0

test:
  imports:
    - oauthlib
    - oauthlib.oauth1
    - oauthlib.oauth1.rfc5849
    - oauthlib.oauth1.rfc5849.endpoints
    - oauthlib.oauth2
    - oauthlib.oauth2.rfc6749
    - oauthlib.oauth2.rfc6749.clients
    - oauthlib.oauth2.rfc6749.endpoints
    - oauthlib.oauth2.rfc6749.grant_types
  requires:
    - pip
    - pytest >=4.0
  source_files:
    - tests/
  commands:
    - pip check
    - pytest tests/

about:
  home: https://github.com/oauthlib/oauthlib
  license_file: LICENSE
  license: BSD-3-Clause
  license_family: BSD
  license_url: https://github.com/oauthlib/oauthlib/blob/master/LICENSE
  summary: A generic, spec-compliant, thorough implementation of the OAuth request-signing logic
  dev_url: https://github.com/oauthlib/oauthlib
  doc_url: https://oauthlib.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
