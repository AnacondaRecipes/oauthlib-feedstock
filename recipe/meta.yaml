{% set name = "oauthlib" %}
{% set version = "4.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: efb274799819440f95b4ab3b818869f1ce9ae26c5beacba0201d1a1b76b54f86

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
  run_constrained:
    # Extra: rsa
    - cryptography >=3.0.0
    # Extra: signals
    - blinker >=1.4.0
    # Extra: signedtoken
    - pyjwt >=2.0.0,<3

test:
  source_files:
    - tests
  imports:
    - oauthlib
    - oauthlib.common
    - oauthlib.oauth2
    - oauthlib.oauth2.rfc6749
    - oauthlib.oauth2.rfc6749.endpoints
    - oauthlib.oauth2.rfc6749.endpoints.base
    - oauthlib.oauth2.rfc6749.errors
    - oauthlib.oauth2.rfc6749.grant_types
    - oauthlib.oauth2.rfc6749.grant_types.authorization_code
    - oauthlib.oauth2.rfc6749.grant_types.base
    - oauthlib.oauth2.rfc6749.grant_types.implicit
    - oauthlib.oauth2.rfc6749.grant_types.refresh_token
    - oauthlib.oauth2.rfc6749.parameters
    - oauthlib.oauth2.rfc6749.request_validator
    - oauthlib.oauth2.rfc6749.tokens
    - oauthlib.oauth2.rfc6749.utils
    - oauthlib.oauth2.rfc8628.endpoints
    - oauthlib.oauth2.rfc8628.endpoints.device_authorization
    - oauthlib.oauth2.rfc8628.errors
    - oauthlib.oauth2.rfc8628.grant_types
    - oauthlib.oauth2.rfc8628.grant_types.device_code
    - oauthlib.openid.connect.core.request_validator
    - oauthlib.signals
    - oauthlib.uri_validate
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests
  requires:
    - pip
    - pytest >=4.0
    - cryptography >=3.0.0
    - blinker >=1.4.0
    - pyjwt >=2.0.0,<3

about:
  home: https://github.com/oauthlib/oauthlib
  license_file: LICENSE
  license: BSD-3-Clause
  license_family: BSD
  summary: A generic, spec-compliant, thorough implementation of the OAuth request-signing logic
  description: |
    oauthlib is a Python package that provides a framework for implementing OAuth 1.0 and 2.0 providers and clients. OAuth is a protocol that
    allows users to grant third-party access to their resources without sharing their credentials. It is commonly used in
    web applications and APIs to enable authorization and authentication.
  dev_url: https://github.com/oauthlib/oauthlib
  doc_url: https://oauthlib.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
